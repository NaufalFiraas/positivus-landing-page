<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <title>Positivus Landing Page</title>
</head>

<body>
    <!-- Navbar Start -->
    <nav class="navbar">
        <a href="#" id="home">
            <img src="images/icon-navbar.svg" alt="positivus">
            <h3>Positivus</h3>
        </a>
        <div class="menus">
            <a href="#about" id="aboutUs">About Us</a>
            <a href="#services" id="services">Services</a>
            <a href="#useCases" id="useCases">Use Cases</a>
            <a href="#pricing" id="pricing">Pricing</a>
            <button type="button">Request a quote</button>
        </div>
        <i data-feather="menu" id="hamburgerMenu"></i>
    </nav>
    <!-- Navbar End -->

    <!-- Hero Start -->
    <section class="hero" id="#home">
        <div class="hero-content">
            <h2>Navigating the digital landscape for success</h2>
            <p>Our digital marketing agency helps businesses grow and succeed online through a range of services
                including SEO, PPC, social media marketing, and content creation</p>
            <button type="button" id="bookConsultation">Book a consultation</button>
        </div>
        <div class="hero-image">
            <img src="images/hero-image.svg" alt="hero-image">
        </div>
    </section>
    <!-- Hero End -->

    <script>
        feather.replace();
    </script>

    <script src="js/script.js"></script>
</body>

</html>
